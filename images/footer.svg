<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="읽어 주셔서 감사합니다">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15142b"/>
      <stop offset="0.55" stop-color="#2e2350"/>
      <stop offset="1" stop-color="#7a3f63"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="110" rx="20"/></clipPath>
    <style>
      .star { fill: #fff; animation: twinkle 3.2s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="110" fill="url(#sky)"/>
    <circle class="star" cx="140" cy="30" r="1.3"/>
    <circle class="star s2" cx="260" cy="76" r="1"/>
    <circle class="star s3" cx="940" cy="28" r="1.4"/>
    <circle class="star" cx="1060" cy="70" r="1"/>
    <circle class="star s2" cx="1130" cy="36" r="1.2"/>
    <text x="600" y="52" text-anchor="middle" fill="#ffd9b0" font-size="22" font-weight="700">읽어 주셔서 감사합니다</text>
    <text x="600" y="80" text-anchor="middle" fill="#bfb3d6" font-size="14" letter-spacing="3">SEE YOU AT DUSK</text>
  </g>
</svg>
