<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="GoldenDusk — 기록하고 공유하며 함께 성장하는 백엔드 개발자 이금주">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15142b"/>
      <stop offset="0.45" stop-color="#2e2350"/>
      <stop offset="0.78" stop-color="#7a3f63"/>
      <stop offset="1" stop-color="#e0875f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffb071" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9a6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9b0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .star { fill: #fff; animation: twinkle 3.2s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.4s; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 930px 262px; }
      @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- stars -->
    <g>
      <circle class="star" cx="620" cy="40" r="1.4"/>
      <circle class="star s2" cx="700" cy="78" r="1"/>
      <circle class="star s3" cx="780" cy="30" r="1.6"/>
      <circle class="star s4" cx="860" cy="64" r="1.1"/>
      <circle class="star" cx="1010" cy="36" r="1.3"/>
      <circle class="star s2" cx="1080" cy="90" r="1"/>
      <circle class="star s3" cx="1140" cy="48" r="1.5"/>
      <circle class="star s4" cx="560" cy="96" r="1"/>
      <circle class="star s2" cx="940" cy="110" r="0.9"/>
      <circle class="star s3" cx="470" cy="28" r="1.1"/>
      <circle class="star s4" cx="1170" cy="130" r="0.9"/>
    </g>

    <!-- setting sun -->
    <circle cx="930" cy="262" r="190" fill="url(#glow)"/>
    <g class="sun">
      <circle cx="930" cy="262" r="62" fill="url(#sun)"/>
    </g>

    <!-- horizon hills -->
    <path d="M0 262 C 180 236, 330 250, 480 244 S 800 226, 980 246 S 1140 250, 1200 240 L1200 320 L0 320 Z" fill="#3a2446"/>
    <path d="M0 284 C 200 268, 420 290, 640 276 S 1000 262, 1200 280 L1200 320 L0 320 Z" fill="#1d1630"/>
    <!-- sun reflection -->
    <g opacity="0.55" fill="#ffc98f">
      <rect x="880" y="292" width="100" height="2" rx="1"/>
      <rect x="898" y="300" width="64" height="2" rx="1"/>
      <rect x="914" y="308" width="32" height="2" rx="1"/>
    </g>

    <!-- text -->
    <g transform="translate(72 0)">
      <text x="0" y="96" fill="#ffcfa6" font-size="15" font-weight="600" letter-spacing="4">BACKEND ENGINEER  ·  3 YEARS</text>
      <text x="-3" y="170" fill="url(#title)" font-size="76" font-weight="800" letter-spacing="-1.5">GoldenDusk</text>
      <rect x="0" y="190" width="44" height="3" rx="1.5" fill="#ffb36b"/>
      <text x="0" y="228" fill="#e9dff5" font-size="21" font-weight="500">기록하고 공유하며 함께 성장하는 개발자, 이금주</text>
    </g>
  </g>
</svg>
